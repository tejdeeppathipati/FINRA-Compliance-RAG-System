# Local PostgreSQL service with pgvector; application data persists in the named volume.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finra_rag
      POSTGRES_USER: finra
      POSTGRES_PASSWORD: finra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finra -d finra_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - finra_postgres_data:/var/lib/postgresql/data

volumes:
  finra_postgres_data:
