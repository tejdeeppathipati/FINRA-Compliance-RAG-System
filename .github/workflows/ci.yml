name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finra_rag
          POSTGRES_USER: finra
          POSTGRES_PASSWORD: finra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finra -d finra_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finra:finra@localhost:5432/finra_rag
      DATABASE_DIRECT_URL: postgresql+psycopg://finra:finra@localhost:5432/finra_rag
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: pytest
      - run: alembic upgrade head
      - run: alembic check
